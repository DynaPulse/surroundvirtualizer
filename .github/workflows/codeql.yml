# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '44 2 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'windows-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        version: '12.2.0'
        platform: x64

    - name: Add MinGW to PATH
      run: |
        echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build (MinGW GCC/G++)
      if: matrix.build-mode == 'manual'
      run: |
        g++ -std=c++17 -Iinclude/headers -Ilib/OpenALlibs/include -Ilib/PortAudioLibs/include \
          src/cli_interface.cpp src/hrtf_library.cpp src/hrtf_processor.cpp src/openal_setup.cpp src/portaudio_setup.cpp app/main.cpp \
          -Llib/OpenALlibs/bin -Llib/PortAudioLibs/bin -lOpenAL32 -lportaudio_x64 -o build/SurroundVirtualizer.exe

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

    - name: Ensure install_app/bin exists
      run: |
        $dest = "${{ github.workspace }}/install_app/bin"
        if (-not (Test-Path $dest)) {
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
        }

    - name: Copy OpenAL32.dll
      run: |
        if (Test-Path "${{ github.workspace }}/lib/OpenALlibs/bin/OpenAL32.dll") {
          Copy-Item "${{ github.workspace }}/lib/OpenALlibs/bin/OpenAL32.dll" "${{ github.workspace }}/install_app/bin/" -Force
        }
    - name: Copy portaudio_x64.dll
      run: |
        if (Test-Path "${{ github.workspace }}/lib/PortAudioLibs/bin/portaudio_x64.dll") {
          Copy-Item "${{ github.workspace }}/lib/PortAudioLibs/bin/portaudio_x64.dll" "${{ github.workspace }}/install_app/bin/" -Force
        }