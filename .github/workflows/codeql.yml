# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '44 2 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'windows-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1

    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v3

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build (CMake + Ninja)
      if: matrix.build-mode == 'manual'
      run: |
        mkdir build
        cd build
        cmake -G "Ninja" ..
        cmake --build . --config Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

    - name: Ensure install_app/bin exists
      run: |
        $dest = "${{ github.workspace }}/install_app/bin"
        if (-not (Test-Path $dest)) {
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
        }

    - name: Copy OpenAL32.dll
      run: |
        if (Test-Path "${{ github.workspace }}/lib/OpenALlibs/bin/OpenAL32.dll") {
          Copy-Item "${{ github.workspace }}/lib/OpenALlibs/bin/OpenAL32.dll" "${{ github.workspace }}/install_app/bin/" -Force
        }
    - name: Copy portaudio_x64.dll
      run: |
        if (Test-Path "${{ github.workspace }}/lib/PortAudioLibs/bin/portaudio_x64.dll") {
          Copy-Item "${{ github.workspace }}/lib/PortAudioLibs/bin/portaudio_x64.dll" "${{ github.workspace }}/install_app/bin/" -Force
        }